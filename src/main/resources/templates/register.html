
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Saraswati College of Engineering</title>

    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>

<body class="register-page">

    <div class="register-wrapper">

        <div class="register-card">

            <!-- Close Button -->
            <a th:href="@{/}" class="register-close" aria-label="Close">
                ×
            </a>

            <!-- Heading -->
            <div class="register-heading">

                <h1>Create Account</h1>
                <p>Create your learning account</p>

            </div>

            <!-- Login / Register Switch -->
            <div class="register-login-switch">

                <a th:href="@{/login}" class="register-tab">
                    Login
                </a>

                <a href="#" class="register-tab active">
                    Register
                </a>

            </div>

            <!-- Error Message -->
            <div class="register-messages">

                <div class="message error" th:if="${error}">
                    <span th:text="${error}"></span>
                </div>

            </div>

            <!-- Registration Form -->
            <form th:action="@{/register}"
                  method="post"
                  class="register-form">

                <!-- CSRF Protection -->
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <!-- Full Name -->
                <div class="register-input-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input type="text"
                           id="name"
                           name="name"
                           placeholder="Enter your full name"
                           autocomplete="name"
                           required>

                </div>

                <!-- Email -->
                <div class="register-input-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input type="email"
                           id="email"
                           name="email"
                           placeholder="Enter your email"
                           autocomplete="email"
                           required>

                </div>

                <!-- Password -->
                <div class="register-input-group">

                    <label for="password">
                        Password
                    </label>

                    <input type="password"
                           id="password"
                           name="password"
                           placeholder="Create a password"
                           minlength="8"
                           autocomplete="new-password"
                           required>

                </div>

                <!-- Confirm Password -->
                <div class="register-input-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input type="password"
                           id="confirmPassword"
                           name="confirmPassword"
                           placeholder="Re-enter your password"
                           minlength="8"
                           autocomplete="new-password"
                           required>

                </div>

                <!-- Selected Role -->
                <div class="register-input-group">

                    <label for="role">
                        Selected Role
                    </label>

                    <select id="role"
                            name="role"
                            required>

                        <option value="">
                            Select your role
                        </option>

                        <option value="STUDENT"
                                th:selected="${param.role != null and param.role[0] == 'STUDENT'}">
                            Student
                        </option>

                        <option value="EDUCATOR"
                                th:selected="${param.role != null and param.role[0] == 'EDUCATOR'}">
                            Educator
                        </option>

                        <option value="ADMIN"
                                th:selected="${param.role != null and param.role[0] == 'ADMIN'}">
                            Admin
                        </option>

                    </select>

                </div>

                <!-- Register Button -->
                <button type="submit"
                        class="register-submit-button">

                    Create Account

                </button>

            </form>

            <!-- Login Link -->
            <div class="register-bottom-text">

                <p>
                    Already have an account?
                    <a th:href="@{/login}">Login</a>
                </p>

            </div>

            <!-- Back to Role Selection -->
            <div class="register-back-link">

                <a th:href="@{/role-selection}">
                    ← Back to Role Selection
                </a>

            </div>

        </div>

    </div>

</body>
</html>
