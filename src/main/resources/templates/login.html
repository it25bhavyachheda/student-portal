<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Saraswati College of Engineering</title>

    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>

<body class="login-page">

    <div class="login-wrapper">

        <div class="login-card">

            <!-- Close Button -->
            <a th:href="@{/}" class="login-close" aria-label="Close">
                ×
            </a>


            <!-- Heading -->
            <div class="login-heading">

                <h1>Welcome Back</h1>

                <p>Login to your learning account</p>

            </div>


            <!-- Role Selection -->
            <div class="login-role-section">

                <label class="login-section-label">
                    Select your role
                </label>

                <div class="login-role-options">

                    <!-- Admin -->
                    <button type="button"
                            class="login-role-card active"
                            data-role="Admin"
                            data-description="Access your administrative dashboard">

                        <span class="login-role-icon">⚙️</span>

                        <span class="login-role-name">
                            Admin
                        </span>

                    </button>


                    <!-- Educator -->
                    <button type="button"
                            class="login-role-card"
                            data-role="Educator"
                            data-description="Access your educator dashboard">

                        <span class="login-role-icon">👨‍🏫</span>

                        <span class="login-role-name">
                            Educator
                        </span>

                    </button>


                    <!-- Student -->
                    <button type="button"
                            class="login-role-card"
                            data-role="Student"
                            data-description="Access your student dashboard">

                        <span class="login-role-icon">🎓</span>

                        <span class="login-role-name">
                            Student
                        </span>

                    </button>

                </div>

            </div>


            <!-- Login / Register Switch -->
            <div class="login-register-switch">

                <a href="#" class="login-tab active">
                    Login
                </a>

                <a th:href="@{/role-selection}" class="login-tab">
                    Register
                </a>

            </div>


            <!-- Messages -->
            <div class="login-messages">

                <div class="message error" th:if="${param.error}">
                    Invalid email or password.
                </div>

                <div class="message success" th:if="${param.logout}">
                    You have been logged out successfully.
                </div>

                <div class="message success" th:if="${message}">
                    <span th:text="${message}"></span>
                </div>

            </div>


            <!-- Login Form -->
            <form th:action="@{/login}" method="post" class="login-form">

                <!-- CSRF Protection -->
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <!-- Email -->
                <div class="login-input-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input type="email"
                           id="email"
                           name="email"
                           placeholder="Enter your email"
                           required>

                </div>


                <!-- Password -->
                <div class="login-input-group">

                    <label for="password">
                        Password
                    </label>

                    <input type="password"
                           id="password"
                           name="password"
                           placeholder="Enter your password"
                           required>

                </div>


                <!-- Login Button -->
                <button type="submit"
                        class="login-submit-button"
                        id="loginSubmitButton">

                    Login as Admin

                </button>

            </form>


            <!-- Role Description -->
            <p class="login-role-description" id="roleDescription">
                Access your administrative dashboard
            </p>

        </div>

    </div>


    <script>

        const roleCards = document.querySelectorAll(".login-role-card");
        const loginButton = document.getElementById("loginSubmitButton");
        const roleDescription = document.getElementById("roleDescription");

        roleCards.forEach(card => {

            card.addEventListener("click", function () {

                roleCards.forEach(item => {
                    item.classList.remove("active");
                });

                this.classList.add("active");

                const role = this.dataset.role;
                const description = this.dataset.description;

                loginButton.textContent = "Login as " + role;
                roleDescription.textContent = description;

            });

        });

    </script>

</body>

</html>
